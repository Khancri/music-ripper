<!-- Four Singing Ceramic Ravens -->
<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            background-color: rgb(37, 37, 37);
            color:whitesmoke;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ravens.4sc</title>
</head>
<body>
    <form action="/download" method="post"><br>
        <label for="url">YouTube URL</label><br>
        <input type="url" name="url" id="url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ"><br>
        <label for="artist">Artist of media</label><br>
        <input type="text" name="artist" id="artist" placeholder="Artist"><br>
        <label for="name">Track name</label><br>
        <input type="text" name="name" id="name" placeholder="Track"><br>
        <label for="album">Album?</label><br>
        <input type="radio" name="album" id="album" checked="false"><br>
        <input type="submit" value="Download">
    </form>
</body>
</html>
